<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Dzień Mamy</title>
<style>
    body {
        margin: 0;
        background: #fff0f6;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
    }

    #bukiet {
        width: 90%;
        max-width: 400px;
        margin-top: 40px;
        cursor: pointer;
    }

    #tekst {
        font-size: 28px;
        font-weight: bold;
        color: #d6336c;
        margin-top: 20px;
        opacity: 0;
        transition: 1s;
        padding: 0 20px;
    }

    .serce {
        position: fixed;
        color: #ff4d6d;
        font-size: 24px;
        animation: spadanie 3s linear forwards;
    }

    @keyframes spadanie {
        0% { transform: translateY(-20px); opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
    }
</style>
</head>
<body>

<img id="bukiet" src="bukiet.png" alt="Bukiet">

<div id="tekst">Od Dominisia dla najlepszej Mamy na świecie ❤️</div>

<script>
let klikniecia = 0;

document.getElementById("bukiet").onclick = () => {
    klikniecia++;

    if (klikniecia === 3) {
        document.getElementById("tekst").style.opacity = 1;
    }

    // serduszka
    const serce = document.createElement("div");
    serce.classList.add("serce");
    serce.innerHTML = "❤️";
    serce.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(serce);

    setTimeout(() => serce.remove(), 3000);
};
</script>

</body>
</html>
